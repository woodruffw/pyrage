on:
  release:
    types:
      - published

name: release

permissions: {}

jobs:
  release-linux:
    name: build Linux release dists
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build wheels
        run: make dist-pyrage

      - name: upload linux dists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyrage-dists-linux
          path: dist/

  release-linux-arm:
    name: build Linux arm release dists
    # Use 22.04, as 24.04 is unstable atm:
    # https://github.com/orgs/community/discussions/148648#discussioncomment-11890717
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: build wheels
        run: make dist-pyrage

      - name: upload linux dists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyrage-dists-linux-arm
          path: dist/

  release-macos:
    name: build macOS release dists
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version-file: pyproject.toml

      - name: build wheels
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          uv run --locked maturin build --release --strip --target universal2-apple-darwin
          mv target/wheels/ dist/

      - name: upload macos dists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyrage-dists-macos
          path: dist/

  release-windows:
    name: build Windows release dists
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version-file: pyproject.toml

      - name: build wheels
        shell: bash
        run: |
          uv run --locked maturin build --release --strip
          mv target/wheels/ dist/

      - name: upload windows dists
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pyrage-dists-windows
          path: dist/

  pypi-publish:
    name: publish all dists to PyPI
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Used for OIDC publishing.
      # Used to sign the release's artifacts with sigstore-python.
      id-token: write

      # Used to attach signing artifacts to the published release.
      contents: write
    needs:
      - release-linux
      - release-linux-arm
      - release-macos
      - release-windows

    steps:
      - name: fetch dists
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pyrage-dists-*
          path: dist/
          merge-multiple: true

      - name: publish
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
